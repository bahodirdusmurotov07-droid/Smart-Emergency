<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Emergency</title>
    
    <!-- PWA sozlamalari -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* Dinamik mobil ekran balandligi */
            overflow: hidden;
            background-color: #020617;
        }
        
        #app {
            width: 100%;
            height: 100%;
            height: 100dvh;
            max-width: 480px; /* Planshet va kompyuterda ham telefon shaklida markazda turishi uchun */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #ffffff;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="flex justify-center items-center select-none font-sans bg-slate-950">

    <div id="app"></div>

    <!-- Modullar tartibi -->
    <script src="auth.js"></script>
    <script src="comment.js"></script>
    <script src="ai_assistant.js"></script>
    <script src="offline_sos.js"></script>
    <script src="lab_panel.js"></script>
    <script src="doctor_panel.js"></script>
    <script src="history.js"></script>
    <script src="components.js"></script>
    <script src="app.js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('SW faol'))
                    .catch(err => console.log('SW xato:', err));
            });
        }
    </script>
</body>
</html>
